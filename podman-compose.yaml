version: '3.8'

services:
  praxis:
    # Built from the modified Praxis checkout with llm-d-sc-praxis-filter compiled in.
    image: ${PRAXIS_IMAGE:-praxis-llm-d-sc:latest}
    ports:
      - "8080:8080"
    volumes:
      - ./praxis.yaml:/etc/praxis/config.yaml:ro
    depends_on:
      - llm-d-sc
      - vllm-gpu
      - vllm-cpu

  # Build this image from llm-d-incubation/llm-d-semantic-classifier.
  # The classifier image does not contain a model; mount the complexity
  # ModelCar from the EC2 host at /models.
  llm-d-sc:
    image: ${LLM_D_SC_IMAGE:-llm-d-sc:latest}
    volumes:
      - ${LLM_D_SC_MODEL_DIR:?Set LLM_D_SC_MODEL_DIR to the host complexity ModelCar directory}:/models:ro,Z
    environment:
      LLM_D_SC_MODEL_DIR: /models
      LLM_D_SC_CLASSIFIER: complexity
      LLM_D_SC_LISTEN: "0.0.0.0:50051"

  # NVIDIA L40S GPU Backend for Heavy/Reasoning Tasks
  vllm-gpu:
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.1-1788369031
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - "python3"
      - "-m"
      - "vllm.entrypoints.openai.api_server"
      - "--model"
      - "Qwen/Qwen2.5-7B-Instruct"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"

  # Host CPU Backend for Lightweight Tasks
  vllm-cpu:
    image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.1-1788368981
    environment:
      - OMP_NUM_THREADS=16
      - VLLM_CPU_KV_CACHE_SPACE=8
    command:
      - "python3"
      - "-m"
      - "vllm.entrypoints.openai.api_server"
      - "--model"
      - "Qwen/Qwen2.5-1.5B-Instruct"
      - "--port"
      - "8000"
      - "--device"
      - "cpu"
