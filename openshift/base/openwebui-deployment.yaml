apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.11.1
          env:
            - name: WEBUI_AUTH
              value: "false"
            - name: WEBUI_SECRET_KEY_FILE
              value: /app/backend/data/.webui_secret_key
            - name: OPENAI_API_BASE_URL
              # The relay preserves OpenAI compatibility while recording the
              # routing headers emitted by Praxis for the trace view.
              value: http://trace-ui:8080/v1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
