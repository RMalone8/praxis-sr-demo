apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: praxis-demo

resources:
  - praxis-deployment.yaml
  - praxis-service.yaml
  - praxis-route.yaml
  - classifier-deployment.yaml
  - classifier-service.yaml
  - openwebui-pvc.yaml
  - openwebui-deployment.yaml
  - openwebui-service.yaml
  - openwebui-route.yaml
  - openwebui-bootstrap-job.yaml

configMapGenerator:
  - name: praxis-config
    files:
      - config.yaml=praxis.yaml
  - name: openwebui-filter
    files:
      - from_model.py=openwebui/from_model.py
  - name: openwebui-bootstrap
    files:
      - bootstrap.py=openwebui/bootstrap.py

generatorOptions:
  disableNameSuffixHash: false

labels:
  - pairs:
      app.kubernetes.io/part-of: praxis-llmd-demo
    includeSelectors: true
